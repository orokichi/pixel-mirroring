<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f6fc" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Pixelミラーリング — Android スマートフォンの画面を PC で全画面表示し、そのまま操作するアプリ" />
  <title>Pixelミラーリング</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pixelミラーリング" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block" />
  </noscript>
  <style>
    :root { color-scheme: light dark; --boot-bg: #0e0e13; --boot-fg: #e6e1ea; --boot-tint: #b6c4ff }
    @media (prefers-color-scheme: light) { :root { --boot-bg: #f6f6fc; --boot-fg: #1a1a22; --boot-tint: #3f5bd9 } }
    html, body { height: 100%; margin: 0; background: var(--boot-bg); color: var(--boot-fg) }
    #root { height: 100% }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--boot-bg) }
    .boot img { width: 76px; height: 76px; animation: boot-in .5s cubic-bezier(.34,1.56,.64,1) both }
    .boot span { font: 700 19px/1 system-ui, sans-serif; letter-spacing: -.01em; opacity: .82 }
    .boot i { display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--boot-tint); opacity: .28; animation: boot-pulse 1.2s ease-in-out infinite }
    @keyframes boot-in { from { opacity: 0; transform: scale(.86) } }
    @keyframes boot-pulse { 50% { opacity: .6; width: 66px } }
  </style>
</head>
<body>
  <div id="root"><div class="boot"><img src="/icon.svg" alt="" /><span>Pixelミラーリング</span><i></i></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
